name: SystemVerilog CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  compile:
    name: Compile / Elaborate
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check SystemVerilog with Verilator
        shell: bash
        run: |
          set -euo pipefail

          mapfile -d '' SOURCES < <(
            find . -type f \( -name "*.sv" -o -name "*.v" \) \
              -not -path "./.git/*" \
              -print0
          )

          if [ "${#SOURCES[@]}" -eq 0 ]; then
            echo "No SystemVerilog or Verilog files found."
            exit 1
          fi

          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            verilator/verilator:v5.050 \
            --lint-only \
            -Wall \
            -Wno-fatal \
            "${SOURCES[@]}"

  style:
    name: Style / Verible
    runs-on: ubuntu-22.04
    needs: compile

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Verible
        uses: chipsalliance/verible-actions-common/install-verible@main
        with:
          verible_version: "v0.0-4084-gf3e4d98b"

      - name: Check SystemVerilog Style
        shell: bash
        run: |
          set -euo pipefail

          mapfile -d '' SOURCES < <(
            find . -type f \( -name "*.sv" -o -name "*.v" \) \
              -not -path "./.git/*" \
              -print0
          )

          if [ "${#SOURCES[@]}" -eq 0 ]; then
            echo "No SystemVerilog or Verilog files found."
            exit 1
          fi

          verible-verilog-lint \
            --ruleset=default \
            --show_diagnostic_context \
            "${SOURCES[@]}"