name: SystemVerilog CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  compile:
    name: Compile / Elaborate
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check SystemVerilog with Verilator
        shell: bash
        run: |
          set -euo pipefail

          mapfile -d '' SOURCES < <(
            find . -type f \( -name "*.sv" -o -name "*.v" \) \
              -not -path "./.git/*" \
              -print0
          )

          if [ "${#SOURCES[@]}" -eq 0 ]; then
            echo "No SystemVerilog or Verilog files found."
            exit 1
          fi

          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            verilator/verilator:v5.050 \
            --lint-only \
            -Wno-fatal \
            "${SOURCES[@]}"

  style:
    name: Style / Verible
    runs-on: ubuntu-22.04
    needs: compile

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Verible
        shell: bash
        env:
          VERIBLE_VERSION: v0.0-4084-gf3e4d98b
        run: |
          set -euo pipefail

          ARCHIVE="verible-${VERIBLE_VERSION}-linux-static-x86_64.tar.gz"
          URL="https://github.com/chipsalliance/verible/releases/download/${VERIBLE_VERSION}/${ARCHIVE}"

          curl -fsSL "$URL" -o "$ARCHIVE"

          mkdir -p /tmp/verible

          tar -xzf "$ARCHIVE" \
            --strip-components=1 \
            -C /tmp/verible

          sudo install -m 0755 \
            /tmp/verible/bin/verible-verilog-lint \
            /usr/local/bin/verible-verilog-lint

          verible-verilog-lint --version

      - name: Check SystemVerilog Style
        shell: bash
        run: |
          set -euo pipefail

          mapfile -d '' SOURCES < <(
            find . -type f \( -name "*.sv" -o -name "*.v" \) \
              -not -path "./.git/*" \
              -print0
          )

          verible-verilog-lint \
            --ruleset=default \
            --show_diagnostic_context \
            "${SOURCES[@]}"